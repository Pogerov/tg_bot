services:
  - type: web
    name: xgen-tournament-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "7753887058"
